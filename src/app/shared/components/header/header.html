<div class="header">
    <h1 (click)="gotoHomePage()">ShipKart</h1>
    <app-searchbar></app-searchbar>
    <div class="account-options-container">
        <div class="account">
            <button *ngIf="!(loggedIn)" class="loginbtn" (click)="openLoginForm()"><fa-icon [icon]="faUserCircle"></fa-icon>Login</button>
            <button *ngIf="(loggedIn)" class="loginbtn" ><fa-icon [icon]="faUserCircle"></fa-icon>{{user?.username}}</button>
            <div class="dropdown">
                <div *ngIf="!(loggedIn)"  class="userAlert">
                    <span>New Customer?</span>
                    <span class="signupalert" (click)="gotosignup()">Signup</span>
                </div>
                <p (click)="gotoProfile()"><fa-icon [icon]="facircleUser"></fa-icon>My profile</p>
                <p (click)="gotoMyOrders()"><fa-icon [icon]="faBoxOpen"></fa-icon>Orders</p>
                <p (click)="gotoWishList()"><fa-icon [icon]="faheart"></fa-icon>Wishlist</p>
                <p *ngIf="(loggedIn)" (click)="logOut()"><fa-icon [icon]="fapowerOff"></fa-icon>Logout</p>

            </div>
        </div>
        
        <button (click)="gotoMyCart()">
            <fa-icon [icon]="faCartShopping" ></fa-icon> 
            Cart</button>
        <button (click)="openloginFormSeller()">
            <fa-icon [icon]="faStore"></fa-icon> a seller</button>
    </div>
  
</div>
